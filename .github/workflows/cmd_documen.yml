# .github/workflows/commands-document.yml
# 触发 PR 评论中的 /document 命令，自动运行 roxygen2 并推送结果

on:
  issue_comment:
    types: [created]

name: PR Commands - Document

permissions:
  pull-requests: write  # 必需：允许推送提交到 PR
  contents: write       # 必需：允许写入仓库

jobs:
  document:
    if: >
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'MEMBER' || 
       github.event.comment.author_association == 'OWNER') &&
      startsWith(github.event.comment.body, '/document')
    name: Generate Documentation
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # 获取 PR 分支代码
      - uses: r-lib/actions/pr-fetch@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # 配置 R 环境（使用公共 RSPM 加速包安装）
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # 安装依赖，仅安装 roxygen2（避免安装整个包依赖树）
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: pr-document

      # 运行 roxygen2 生成文档
      - name: Document
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      # 提交更改（仅文档相关文件）
      - name: Commit changes
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add man/*.Rd NAMESPACE
          # 仅在确有变更时提交，避免空提交
          if ! git diff --staged --quiet; then
            git commit -m 'docs: auto-update via /document command'
          else
            echo "No documentation changes to commit"
          fi

      # 推送回原 PR
      - uses: r-lib/actions/pr-push@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
name: 📬 Notify New Issue to Feishu

on:
    check_run:
        types: [rerequested, completed]
    check_suite:
        types: [completed]
    create:
    delete:
    deployment_status:
    discussion:
        types: [created, edited, answered]
    discussion_comment:
        types: [created, deleted]
    gollum:
    issues:
        types: [opened, edited, milestoned, pinned, reopened]
    issue_comment:
        types: [created, deleted]
    merge_group:
        types: [checks_requested]
    # milestone:
    #     types: [opened, deleted]
    page_build:
    project:
        types: [created, deleted, reopened]
    project_card:
        types: [created, deleted]
    project_column:
        types: [created, deleted]
    public:
    pull_request:
        branches: ["main", "devel"]
        types: [opened, reopened]
    pull_request_review:
        types: [edited, dismissed, submitted]
    pull_request_review_comment:
        types: [created, edited, deleted]
    pull_request_target:
        types: [assigned, opened, synchronize, reopened]
    registry_package:
        types: [published]
    # status:
    # watch:
    #     types: [started]
    # schedule:
    #     - cron: "30 2 * * *"

jobs:
    send-event:
        name: Webhook
        runs-on: ubuntu-latest
        steps:
            - uses: WangLabCSU/feishu-bot-webhook-action@main
              with:
                  webhook: ${{ secrets.FEISHU_BOT_WEBHOOK }}
                  signkey: ${{ secrets.FEISHU_BOT_SIGNKEY }}

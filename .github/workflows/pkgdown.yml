on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    release:
        types: [published]
    workflow_dispatch:

name: pkgdown

permissions:
    contents: write

jobs:
    pkgdown:
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true
        env:
            GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: actions/checkout@v4

            - uses: r-lib/actions/setup-pandoc@v2

            - uses: r-lib/actions/setup-r@v2
              with:
                  use-public-rspm: true

            - uses: r-lib/actions/setup-r-dependencies@v2
              with:
                  # `dependencies: hard` only installs Imports/LinkingTo, but
                  # pkgdown knits every vignette, so the Suggests used by the
                  # *evaluated* chunks must be installed explicitly:
                  #   knitr/rmarkdown  vignette engine and rmarkdown output
                  #   zeallot          Extending_ScreenMethod (setup chunk)
                  #   dplyr            PhenoMap() in Full_Tutorial,
                  #                    InterceptStrategy() in
                  #                    Extending_Annotation / Extending_Seurat /
                  #                    Extending_ScreenMethod
                  #   fgsea            BenchGSEA() in Benchmark_GSEA (its chunks
                  #                    are skipped without fgsea + dplyr)
                  # Chunks marked `eval: false` (ggVennDiagram, patchwork,
                  # tibble, qs2, future, SingleR, ...) are not run by pkgdown
                  # and therefore need no installation.
                  extra-packages: |
                      any::pkgdown
                      local::.
                      any::knitr
                      any::rmarkdown
                      any::zeallot
                      any::dplyr
                      any::fgsea
                  dependencies: '"hard"'
            - name: Build site
              run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
              shell: Rscript {0}

            - name: Deploy to GitHub pages 🚀
              if: github.event_name != 'pull_request'
              uses: JamesIves/github-pages-deploy-action@v4.8.0
              with:
                  clean: false
                  branch: gh-pages
                  folder: docs

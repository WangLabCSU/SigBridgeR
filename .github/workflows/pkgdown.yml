on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    release:
        types: [published]
    workflow_dispatch:

name: pkgdown

permissions:
    contents: write

jobs:
    pkgdown:
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true
        env:
            GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: actions/checkout@v4

            - uses: r-lib/actions/setup-pandoc@v2

            - uses: r-lib/actions/setup-r@v2
              with:
                  use-public-rspm: true

            - name: Install system dependencies
              # pkgdown/knitr/xfun pull in `magick`, whose compiled magick.so
              # links against the native Magick++ library. RSPM only ships the R
              # binary, so the system library must be installed explicitly here.
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libmagick++-dev
                  ldconfig -p | grep -i Magick++ || true

            - uses: r-lib/actions/setup-r-dependencies@v2
              with:
                  extra-packages: |
                      any::pkgdown
                      local::.
                      any::knitr
                      any::rmarkdown
                      any::zeallot
                      any::dplyr
                      any::fgsea
                  dependencies: '"hard"'

            - name: Rebuild magick against system ImageMagick
              run: Rscript -e 'install.packages("magick", type = "source")'

            - name: Build site
              run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
              shell: Rscript {0}

            - name: Deploy to GitHub pages 🚀
              if: github.event_name != 'pull_request'
              uses: JamesIves/github-pages-deploy-action@v4.8.0
              with:
                  clean: false
                  branch: gh-pages
                  folder: docs

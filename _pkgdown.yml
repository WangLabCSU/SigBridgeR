url: https://wanglabcsu.github.io/sigbridger/

template:
    bootstrap: 5
    light-switch: true
    bslib:
        bootswatch: sandstone
        code_font: { google: "JetBrains Mono" }
        pkgdown-nav-height: 100px
        bg: white
        fg: black
        primary: "#2c5f9b"

title: SigBridgeR
description: >-
    SigBridgeR: SigBridgeR integrates multiple algorithms, using single-cell RNA sequencing data, bulk expression data, and sample-related phenotypic data, to identify the cells most closely associated with the phenotypic data, performing as a bridge to existing tools.
logo:
    light: man/figures/logo_white.png
    dark: man/figures/logo_black.png

reference:
    - title: Data Preprocessing
      desc: >
          Functions for preprocessing inputs.
      contents:
          - SCPreProcess
          - QCFilter
          - QCPatternDetect
          - Pattern2Colname
          - SymbolConvert
          - AggregateDups
          - AggregateDupRows
          - AggregateDupCols
          - SCIntegrate
          - CheckNA
          - PhenoPreProcess
          - PhenoMap
          - CountsToTPM
          - IsSkewedDynamic

    - title: Result Integration & Visualization
      desc: >
          Merge and visualize screening results across methods or conditions.
      contents:
          - MergeResult
          - WeightedVote
          - DrawBulkPCA
          - ScreenFractionPlot
          - ScreenUpset
          - autoplot
          - autoplot-SigBridgeR
          - palette_SigBridgeR

    - title: Screening Methods
      desc: >
          Built-in screening algorithms.
      contents:
          - Screen
          - DoLP_SGL
          - DoPIPET
          - DoScissor
          - DoscAB
          - DoscPAS
          - DoscPP
          - DoDEGAS
          - DoSIDISH
          - DoSCIPAC
          - DoTiRank

    - title: Seurat Object Utilities
      contents:
          - AddMetaFeature
          - AddMisc
          - FindRobustElbow
          - ChooseNormalization

    - title: Annotate Cell Types in Single-cell Datasets
      desc: >
          Built-in annotationa algorithms.
      contents:
          - SCAnnotate
          - CellTypistAnnotate
          - SingleRAnnotate
          - mLLMCelltypeAnnotate

    - title: Reference Data & External Resources
      desc: >
          Load reference datasets.
      contents:
          - LoadRefData

    - title: Python Environment Management
      desc: >
          Manage Python environments for integrated R/Python workflows.
      contents:
          - SetupPyEnv
          - ListPyEnv

    - title: Extension Tools
      contents:
          - InterceptStrategy
          - Register
          - RegisterScreenMethod
          - RegisterAnnoMethod
          - RegisterSeuratMethod
          - ValidateScreenFunc
          - TemplateScreenFunc

    - title: Registry
      desc: >
          Extended registry for SigBridgeR
      contents:
          - SCPreProcessStrategy
          - SCAnnotateStrategy
          - ScreenStrategy

    - title: Cache Management
      desc: >
          Manage cache files for SigBridgeR
      contents:
          - WriteCacheMeta
          - CheckCache
          - ChooseCache
          - WriteCache
          - LoadCache
          - CacheSetHere
          - CacheSysCall

    - title: Package Configuration
      desc: >
          Get and set global options for SigBridgeR behavior.
      contents:
          - getFuncOption
          - setFuncOption
          - setThreads

    - title: OOP Sytem Design
      desc: >
          OOP system design for SigBridgeR
      contents:
          - SigBridgeRBase
          - Method
          - ScreenMethod
          - ScreenMethodCache
          - ScreenMethodConfig
          - ScreenMethodResult
          - AnnotationMethod
          - SigBridgeR-properties
          - SigBridgeR-S3
          - Property-visitor
          - as.character.list

# 导航栏配置
navbar:
    structure:
        left:
            - intro
            - reference
            - articles
            - troubleshooting
            - tutorials
            - news
        right:
            - search
            - github
            - lightswitch
    components:
        toggle_theme: ~
        home:
            text: Home
            icon: fa-home
            href: index.html
        reference:
            text: Functions
            icon: fa-code
            href: reference/index.html
        troubleshooting:
            text: Troubleshooting
            icon: fa-bug
            href: articles/Troubleshooting.html
        search: []
        lightswitch:
            icon: fa-sun
            aria-label: Light switch
            id: lightswitch
            menu:
                - text: Light
                  theme: light
                  icon: fa-sun
                - text: Dark
                  theme: dark
                  icon: fa-moon
